appId: com.local.memereply
---
# Credentials are injected by scripts/nas-e2e.sh at run time and are never
# committed to this repository.
- launchApp:
    clearState: true
- tapOn: "邮箱"
- inputText: ${E2E_EMAIL}
- tapOn: "密码（至少 10 位）"
- inputText: ${E2E_PASSWORD}
- tapOn: "登录"
- extendedWaitUntil:
    visible: "已登录："
    timeout: 20000
- tapOn: "＋ 选择收到的表情"
# The bootstrap script registers this exact MediaStore item before Maestro
# starts. DocumentsUI shows the recent image as the first tile.
- extendedWaitUntil:
    visible: "Recent"
    timeout: 15000
- tapOn:
    point: "25%,40%"
- tapOn: "我知道了"
- scrollUntilVisible:
    element: "生成一张新回击图"
    direction: DOWN
    timeout: 20000
- tapOn: "生成一张新回击图"
- extendedWaitUntil:
    visible: "生成完成"
    timeout: 240000
- assertVisible: "新回击图已显示在这里"
- takeScreenshot: generation-complete
